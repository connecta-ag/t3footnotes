name: Bug report
description: Report something that does not work as described in the manual
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe what you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page with ...
        2. Insert a footnote in the RTE ...
        3. ...
    validations:
      required: true
  - type: input
    id: typo3-version
    attributes:
      label: TYPO3 version
      placeholder: 14.3.x
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.x
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 2.0.x
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: RTE preset, site settings, browser, screenshots or log entries.
